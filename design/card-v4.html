<!doctype html>
<meta charset="utf-8">
<title>WFH card v4 — due-now collision (368×448)</title>
<!--
  The screen for when two or more timers land together. One row per due
  action, each a colour block in its action's tint; tapping a row toggles
  it done (filled = will log). Confirm logs the checked ones, +15m delays
  everything, X dismisses. Shown with three due: stand, water, roll —
  stand and water checked, roll not. Rects + alpha only.
-->
<style id="fonts">
  @font-face { font-family: "Geist"; src: url("fonts/Geist-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Geist"; src: url("fonts/Geist-700.woff2") format("woff2"); font-weight: 700; }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 368px; height: 448px; overflow: hidden; }
  body {
    background: #0a0d11;
    font: 500 14px/1.3 Geist, -apple-system, system-ui, sans-serif;
    color: #e6edf3;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .title { position: absolute; left: 16px; top: 22px;
           font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .x     { position: absolute; right: 0; top: 0; width: 64px; height: 64px;
           display: grid; place-items: center; font-size: 26px; opacity: .9; }

  /* One row per due action. Checked = solid tint block, dark content.
     Unchecked = quiet block, tinted content. The row is the checkbox. */
  .rows { position: absolute; left: 16px; right: 16px; top: 72px;
          display: flex; flex-direction: column; gap: 10px; }
  .row  { height: 62px; border-radius: 16px; position: relative;
          display: flex; align-items: center; gap: 14px; padding: 0 18px; }
  .row .ic   { width: 40px; height: 40px; flex: none; }
  .row .txt  { flex: 1; line-height: 1.15; }
  .row .name { font-size: 17px; font-weight: 700; }
  .row .sub  { font-size: 14px; font-weight: 500; opacity: .5; margin-top: 2px; }
  .row.on .sub { opacity: .65; }
  .row .mark { width: 26px; height: 26px; border-radius: 99px; flex: none;
               display: grid; place-items: center; }

  .row.on  { background: var(--tint); color: #0a0d11; }
  .row.on .ic { color: #0a0d11; }
  .row.on .mark { background: rgba(10, 13, 17, .18); }
  .row.on .mark svg { width: 14px; height: 14px; stroke: #0a0d11; }

  .row.off { background: color-mix(in srgb, var(--tint) 13%, #0a0d11); }
  .row.off .ic { color: var(--tint); }
  .row.off .txt { color: #e6edf3; }
  .row.off .mark { border: 2px solid color-mix(in srgb, var(--tint) 55%, transparent); }

  .confirm { position: absolute; left: 16px; right: 16px; bottom: 88px; height: 66px;
             background: #e6edf3; color: #0a0d11;
             border-radius: 16px; display: grid; place-items: center;
             font-size: 17px; font-weight: 700; }
  .delay   { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 56px;
             background: rgba(255, 255, 255, .08);
             border-radius: 14px; display: grid; place-items: center;
             font-size: 15px; color: rgba(230, 237, 243, .85);
             font-variant-numeric: tabular-nums; }
</style>

<div class="title">Due now</div>
<div class="x">✕</div>

<div class="rows">
  <div class="row on" style="--tint:#7fd4a8">
    <svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 21h-1l-.927-3.708a1 1 0 0 0-.295-.495L9.5 13.8m-3 7.2l-.5-.5l2.333-2.333a1 1 0 0 0 .242-.391L9 16.5m-3-4l1.393-2.322a1 1 0 0 1 .276-.299L11 7.5l3.37 3.852q.13.148.306.236l1.824.912M14 5a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-4 9a.97.97 0 0 1-.943-1.203l1-4.059a.971.971 0 0 1 1.886.465l-1 4.059a.97.97 0 0 1-.944.738"/></svg>
    <div class="txt"><div class="name">Stand break</div><div class="sub">missed 11:40</div></div>
    <div class="mark"><svg viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="row on" style="--tint:#6ec3e0">
    <svg class="ic" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 9s2.5-1 6 .5s6 .5 6 .5m-8 3h.002M13 16h.002m3.103 5h-8.21a1 1 0 0 1-.994-.89L5.061 3.555A.5.5 0 0 1 5.56 3h12.88a.5.5 0 0 1 .497.555l-1.84 16.555a1 1 0 0 1-.993.89"/></svg>
    <div class="txt"><div class="name">Water</div><div class="sub">missed 11:15</div></div>
    <div class="mark"><svg viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="row off" style="--tint:#b6a3e8">
    <svg class="ic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M13.5 6.5m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/><path d="M13.5 6.5c-1.5 0-2.5 1-4 1s-2.5-1-2.5-1m8 14v-5.5l-2-2.5m-5.5 8l2.5-5.5l1.5-4.5c1.5 1 2.5 2 4.5 2"/></g></svg>
    <div class="txt"><div class="name">Shoulder roll</div><div class="sub">missed 11:00</div></div>
    <div class="mark"></div>
  </div>
</div>

<div class="confirm">Log 2 done</div>
<!-- With nothing ticked the button reads "Log 0 done" at 12% and is inert. -->
<div class="delay">+15m for all</div>
