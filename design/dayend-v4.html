<!doctype html>
<meta charset="utf-8">
<title>dayend-v4</title>
<!--
  After the last window can close (work end + grace) until work start: the
  day's tally and nothing to answer. Tapping anywhere peeks at the grid.
  Same geometry and system as card-v4.html.
-->
<style>
  @font-face { font-family: "Geist"; src: url("fonts/Geist-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Geist"; src: url("fonts/Geist-700.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  body { width: 368px; height: 448px; overflow: hidden; position: relative;
         background: #0a0d11; color: #e6edf3;
         font: 500 14px/1.3 Geist, -apple-system, system-ui, sans-serif; }
  .title { position: absolute; left: 0; right: 0; top: 52px; text-align: center;
           font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .sub   { position: absolute; left: 0; right: 0; top: 92px; text-align: center;
           color: rgba(230,237,243,.5); }
  /* The tally: the six actions in their tints, done over target. A full
     one reads bright, an unfinished one muted — no rings, no judgement. */
  .tally { position: absolute; left: 16px; right: 16px; top: 150px;
           display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 28px; }
  .cell  { text-align: center; color: var(--tint); }
  .ic    { width: 40px; height: 40px; }
  .n     { margin-top: 6px; font-size: 15px; color: rgba(230,237,243,.5);
           font-variant-numeric: tabular-nums; }
  .n b   { color: var(--tint); font-weight: 700; font-size: 18px; }
  .foot  { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center;
           font-size: 13px; color: rgba(230,237,243,.35); }
</style>
