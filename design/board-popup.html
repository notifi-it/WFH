<!doctype html>
<meta charset="utf-8">
<title>WFH board — action popup</title>
<!--
  368x448. Opened by tapping a tile (§7.3). One action, one decision.

  The tile is deliberately wordless; this screen is where the words live —
  it is the only place the blurb has to say what the action means, and you
  only get here on purpose.
-->
<style id="fonts">
  /* Two candidates, switchable with ?font=. Both are OFL and convert to LVGL
     with lv_font_conv, so the screen and the firmware can share a typeface
     rather than the design drifting from what the board can actually render. */
  @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Manrope"; src: url("fonts/Manrope-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Manrope"; src: url("fonts/Manrope-700.woff2") format("woff2"); font-weight: 700; }
</style>
<script>
  const f = new URLSearchParams(location.search).get('font') || 'Space Grotesk';
  document.documentElement.style.setProperty('--font', `"${f}"`);
</script>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --pending: #30363d;
    --grey:    #6e7681;
    --tint:    #6ec3e0;          /* set per action */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 368px; height: 448px; overflow: hidden; }
  body {
    background: var(--bg);
    font: 500 14px/1.35 var(--font), -apple-system, system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* The tint bleeds up from the bottom, echoing the tile's wash so the
     transition from grid to popup feels like the same object opening. */
  .bleed {
    position: absolute; inset: auto 0 0 0; height: 300px;
    background: radial-gradient(120% 100% at 50% 100%,
                color-mix(in srgb, var(--tint) 26%, transparent), transparent 70%);
    pointer-events: none;
  }

  .bar { position: absolute; top: 0; left: 0; right: 0; height: 56px; }
  .glyph {
    position: absolute; top: 12px; width: 44px; height: 44px;
    display: grid; place-items: center;
    color: var(--muted); font-size: 19px;
  }
  .glyph.left  { left: 6px; }
  .glyph.right { right: 6px; color: var(--text); font-size: 22px; }

  .hero { position: absolute; top: 58px; left: 0; right: 0; text-align: center; }
  .icon {
    width: 76px; height: 76px; stroke: var(--tint); fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 18px color-mix(in srgb, var(--tint) 45%, transparent));
  }
  h1 {
    margin-top: 10px;
    font-size: 27px; font-weight: 600; letter-spacing: -.02em;
    color: var(--tint);
  }
  .blurb { margin: 8px auto 0; max-width: 268px; color: var(--muted); font-size: 14px; }

  /* Today, at a glance — the same dot vocabulary as the tile (§7.2), so the
     popup teaches what the grid is saying. */
  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 16px; }
  .dot  { width: 8px; height: 8px; border-radius: 99px; }
  .done { background: var(--tint); }
  .skip { background: var(--grey); }
  .miss { border: 1px solid var(--grey); }
  .pend { background: var(--pending); }

  .status {
    position: absolute; left: 0; right: 0; bottom: 168px; text-align: center;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .status b { color: var(--tint); font-weight: 600; }

  .actions { position: absolute; left: 16px; right: 16px; bottom: 16px; }
  button {
    display: block; width: 100%; border: 0; border-radius: 16px;
    font: inherit; color: var(--bg); cursor: pointer;
  }
  .primary {
    height: 84px; background: var(--tint);
    font-size: 22px; font-weight: 600; letter-spacing: -.01em;
  }
  .secondary {
    height: 52px; margin-top: 10px; background: transparent;
    color: var(--muted); font-size: 15px;
    border: 1px solid var(--pending);
  }
</style>

<body style="--tint:#6ec3e0">
  <div class="bleed"></div>

  <div class="bar">
    <div class="glyph left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/>
        <path d="M18.5 7a7 7 0 0 1 0 10"/>
      </svg>
    </div>
    <div class="glyph right">&#10005;</div>   <!-- §7.3a: one X, everywhere -->
  </div>

  <div class="hero">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 3s6 6.5 6 10.5A6 6 0 0 1 6 13.5C6 9.5 12 3 12 3Z"/>
    </svg>
    <h1>Water</h1>
    <p class="blurb">Glass of water. Refill while you are up.</p>
    <div class="dots">
      <i class="dot done"></i><i class="dot done"></i><i class="dot done"></i>
      <i class="dot skip"></i><i class="dot pend"></i><i class="dot pend"></i>
      <i class="dot pend"></i><i class="dot pend"></i>
    </div>
  </div>

  <div class="status"><b>Due now</b> &nbsp;·&nbsp; 3 of 8 today</div>

  <div class="actions">
    <button class="primary">Done</button>
    <button class="secondary">Skip</button>
  </div>
</body>
