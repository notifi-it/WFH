<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFH board — prototype</title>
<!--
  Clickable mock of the whole board at 368x448. Tap a tile to open its popup,
  Done/Skip to answer, X to go back. The waterline actually moves.

  Fake on purpose: the schedule is frozen and the numbers are made up. This
  exists to settle what the thing looks and feels like before any of it is
  transcribed into LVGL (§11 step 0).
-->
<style>
  @font-face { font-family:"Geist"; src:url("fonts/Geist-500.woff2") format("woff2"); font-weight:500 }
  @font-face { font-family:"Geist"; src:url("fonts/Geist-700.woff2") format("woff2"); font-weight:700 }

  :root {
    --bg:#0d1117; --tile:#161b22; --text:#e6edf3; --muted:#8b949e;
    --pending:#30363d; --grey:#6e7681;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body {
    background:#07090c; color:var(--text);
    font:500 14px/1.35 Geist, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; place-items:center; gap:14px;
    padding:24px; grid-auto-flow:row;
  }
  .frame {
    position:relative; width:368px; height:448px; overflow:hidden;
    background:var(--bg); border-radius:26px;
    box-shadow:0 0 0 10px #16181d, 0 0 0 11px #2a2e35, 0 24px 60px #0007;
  }
  .hint { color:#4b525c; font-size:12px; letter-spacing:.02em }

  .screen { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .16s ease }
  .screen.on { opacity:1; pointer-events:auto }

  /* ---------------------------------------------------------------- grid */
  .grid { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:104px; gap:8px; padding:6px }
  .tile {
    position:relative; background:var(--tile); border:2px solid var(--tint);
    border-radius:14px; overflow:hidden; padding:8px; cursor:pointer;
  }
  .tile:active { transform:scale(.985) }
  .tile.wide { grid-column:1 / -1 }

  .wash {
    position:absolute; left:0; right:0; bottom:0; height:var(--fill);
    background:linear-gradient(to top, color-mix(in srgb, var(--tint) 42%, transparent), transparent);
    transition:height .5s ease;
  }
  /* The surface is a wide wave translated sideways — only the crest moves,
     which is the whole reason this is affordable on the real panel. */
  .surface { position:absolute; left:0; right:0; bottom:calc(var(--fill) - 4px); height:8px;
             overflow:hidden; opacity:.85; transition:bottom .5s ease }
  .surface svg { position:absolute; left:0; width:200%; height:100%;
                 animation:drift 3.2s linear infinite }
  .surface path { fill:none; stroke:var(--tint); stroke-width:1.6 }
  @keyframes drift { to { transform:translateX(-50%) } }

  .icon { position:relative; width:34px; height:34px; stroke:var(--tint); fill:none;
          stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;
          filter:drop-shadow(0 1px 3px var(--bg)) }
  .cd { position:absolute; top:8px; right:10px; font-size:22px; font-weight:600;
        letter-spacing:-.02em; font-variant-numeric:tabular-nums;
        text-shadow:0 1px 3px var(--bg), 0 0 6px var(--bg) }

  .dots { position:absolute; left:10px; bottom:10px; display:flex; gap:4px }
  .dot { width:7px; height:7px; border-radius:99px }
  .done { background:var(--tint) } .skip { background:var(--grey) }
  .miss { border:1px solid var(--grey) } .pend { background:var(--pending) }

  /* --------------------------------------------------------------- popup */
  .bleed { position:absolute; inset:auto 0 0 0; height:300px; pointer-events:none;
           background:radial-gradient(120% 100% at 50% 100%,
                      color-mix(in srgb, var(--tint) 26%, transparent), transparent 70%) }
  .glyph { position:absolute; top:12px; width:44px; height:44px; display:grid;
           place-items:center; color:var(--muted); cursor:pointer }
  .glyph.left { left:6px } .glyph.right { right:6px; color:var(--text) }

  .hero { position:absolute; top:58px; left:0; right:0; text-align:center }
  .hero .icon { width:76px; height:76px; stroke-width:1.5;
                filter:drop-shadow(0 0 18px color-mix(in srgb, var(--tint) 45%, transparent)) }
  h1 { margin-top:10px; font-size:27px; font-weight:700; letter-spacing:-.02em; color:var(--tint) }
  .blurb { margin:8px auto 0; max-width:268px; color:var(--muted) }
  .hero .dots { position:static; justify-content:center; margin-top:16px; gap:5px }
  .hero .dot { width:8px; height:8px }

  .status { position:absolute; left:0; right:0; bottom:168px; text-align:center;
            font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums }
  .status b { color:var(--tint); font-weight:600 }

  .actions { position:absolute; left:16px; right:16px; bottom:16px }
  button { display:block; width:100%; height:66px; border:0; border-radius:16px;
           font:600 19px Geist, system-ui, sans-serif; letter-spacing:-.01em;
           color:var(--bg); cursor:pointer }
  .secondary { margin-top:10px; background:transparent; color:var(--muted);
               border:1px solid var(--pending) }
</style>

<div class="frame">
  <div id="gridScreen" class="screen on"><div class="grid" id="grid"></div></div>
  <div id="popScreen" class="screen">
    <div class="bleed"></div>
    <div class="glyph left" id="sound" title="mute"></div>
    <div class="glyph right" id="close">&#10005;</div>
    <div class="hero">
      <svg class="icon" id="popIcon" viewBox="0 0 24 24"></svg>
      <h1 id="popName"></h1>
      <p class="blurb" id="popBlurb"></p>
      <div class="dots" id="popDots"></div>
    </div>
    <div class="status" id="popStatus"></div>
    <div class="actions">
      <button class="primary" id="btnDone">Done</button>
      <button class="secondary" id="btnSkip">Skip</button>
    </div>
  </div>
</div>
<p class="hint">tap a tile · Done / Skip / X · the numbers are fake</p>

<script>
const ICONS = {
  stand:  '<circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v7m0 0-3 6m3-6 3 6M8 10h8"/>',
  water:  '<path d="M12 3s6 6.5 6 10.5A6 6 0 0 1 6 13.5C6 9.5 12 3 12 3Z"/>',
  roll:   '<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>',
  snack:  '<path d="M12 8c-4-3-8 0-8 5s4 8 5.5 8 1.6-.8 2.5-.8 1 .8 2.5.8S20 18 20 13s-4-8-8-5Z"/><path d="M12 8c0-2 1-3.5 3-4"/>',
  lunch:  '<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8 7.5c0-1.5 1-2 1-3M12 7.5c0-1.5 1-2 1-3M16 7.5c0-1.5 1-2 1-3"/>',
  stretch:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  shutdown:'<path d="M20 13.5A8 8 0 0 1 10.5 4a7 7 0 1 0 9.5 9.5Z"/>',
};
const SPEAKER_ON  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg>';
const SPEAKER_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="m16 10 5 4m0-4-5 4"/></svg>';
const WAVE = '<svg viewBox="0 0 240 8" preserveAspectRatio="none"><path d="M0 4Q7.5 .6 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4T135 4T150 4T165 4T180 4T195 4T210 4T225 4T240 4"/></svg>';

// Frozen state. Fake by design — this settles the look, not the logic.
const ACTIONS = [
  { id:'stand',   name:'Stand break',   tint:'#7fd4a8', blurb:'Up on your feet for a minute.',              target:10, done:4, skip:0, miss:1, mins:4,   due:false },
  { id:'water',   name:'Water',         tint:'#6ec3e0', blurb:'Glass of water. Refill while you are up.',   target:8,  done:3, skip:1, miss:0, mins:0,   due:true  },
  { id:'roll',    name:'Shoulder roll', tint:'#b6a3e8', blurb:'Ten slow rolls back, then drop the shoulders.', target:8, done:2, skip:0, miss:2, mins:1, due:false },
  { id:'snack',   name:'Snack',         tint:'#e8b06a', blurb:'Something small before the slump.',          target:2,  done:1, skip:0, miss:0, mins:null,due:false },
  { id:'lunch',   name:'Lunch',         tint:'#e8926a', blurb:'Away from the desk.',                        target:1,  done:0, skip:0, miss:0, mins:26,  due:false },
  { id:'stretch', name:'Stretches',     tint:'#e0d16a', blurb:'Four stretches, about three minutes.',       target:2,  done:1, skip:0, miss:0, mins:55,  due:false },
  { id:'shutdown',name:'Shut down',     tint:'#8f9aa8', blurb:'Close the laptop. That is the day.',         target:1,  done:0, skip:0, miss:0, mins:132, due:false },
];
let soundOn = true, open_ = null;

const dotsHTML = a => {
  const n = Math.max(a.target, a.done + a.skip + a.miss);
  return Array.from({length:n}, (_,d) =>
    `<i class="dot ${d < a.done ? 'done' : d < a.done+a.skip ? 'skip'
       : d < a.done+a.skip+a.miss ? 'miss' : 'pend'}"></i>`).join('');
};
const fill = a => a.mins == null ? 0
  : Math.round(Math.min(1, 1 - a.mins / (a.id==='shutdown' ? 180 : a.id==='lunch' ? 60 : 45)) * 100);

function drawGrid() {
  document.getElementById('grid').innerHTML = ACTIONS.map((a,i) => `
    <div class="tile ${i===6?'wide':''}" style="--tint:${a.tint}; --fill:${fill(a)}px" data-i="${i}">
      <div class="wash"></div>
      ${fill(a) > 2 ? `<div class="surface">${WAVE}</div>` : ''}
      <svg class="icon" viewBox="0 0 24 24">${ICONS[a.id]}</svg>
      <div class="cd">${a.due ? 'now' : a.mins == null ? '—' : a.mins > 90 ? (a.mins/60|0)+'h '+(a.mins%60)+'m' : a.mins+'m'}</div>
      <div class="dots">${dotsHTML(a)}</div>
    </div>`).join('');
  document.querySelectorAll('.tile').forEach(t =>
    t.onclick = () => showPopup(+t.dataset.i));
}

function showPopup(i) {
  open_ = i;
  const a = ACTIONS[i];
  const s = document.getElementById('popScreen');
  s.style.setProperty('--tint', a.tint);
  document.getElementById('popIcon').innerHTML = ICONS[a.id];
  document.getElementById('popName').textContent = a.name;
  document.getElementById('popBlurb').textContent = a.blurb;
  document.getElementById('popDots').innerHTML = dotsHTML(a);
  document.getElementById('popStatus').innerHTML = a.due
    ? `<b>Due now</b> &nbsp;·&nbsp; ${a.done} of ${a.target} today`
    : `${a.done} of ${a.target} today &nbsp;·&nbsp; ${a.mins == null ? 'nothing left' : 'next in ' + a.mins + 'm'}`;
  document.getElementById('gridScreen').classList.remove('on');
  s.classList.add('on');
}

function back() {
  document.getElementById('popScreen').classList.remove('on');
  document.getElementById('gridScreen').classList.add('on');
  open_ = null;
}

function answer(kind) {
  const a = ACTIONS[open_];
  if (kind === 'done') { a.done++; a.mins = a.id === 'water' ? 45 : 40; a.due = false; }
  else                 { a.skip++; a.due = false; }
  drawGrid(); back();
}

document.getElementById('btnDone').onclick = () => answer('done');
document.getElementById('btnSkip').onclick = () => answer('skip');
document.getElementById('close').onclick = back;
document.getElementById('sound').onclick = () => {
  soundOn = !soundOn;
  document.getElementById('sound').innerHTML = soundOn ? SPEAKER_ON : SPEAKER_OFF;
};
document.getElementById('sound').innerHTML = SPEAKER_ON;
drawGrid();
</script>
</html>
