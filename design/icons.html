<!doctype html><meta charset="utf-8">
<title>icon sheet</title>
<!-- Source of truth for the firmware icons. Rendered white-on-transparent
     and converted to LVGL A8 alpha images, which the UI then recolours per
     action — one asset each, tint applied at runtime. -->
<style>
  * { margin:0; padding:0 }
  body { background:transparent }
  .ico { width:34px; height:34px; display:block }
  svg { width:34px; height:34px; stroke:#fff; fill:none;
        stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
</style>

<div class="ico" id="roll"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg></div>
