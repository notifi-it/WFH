<!doctype html>
<meta charset="utf-8">
<title>WFH board — icon grid</title>
<!--
  368x448, no header bar. Icon-led tiles: the icon is the only identifier,
  the dots carry the day, and the wash is the countdown.
-->
<style id="fonts">
  @font-face { font-family: "Geist"; src: url("fonts/Geist-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Geist"; src: url("fonts/Geist-700.woff2") format("woff2"); font-weight: 700; }
</style>
<style>
  :root {
    --bg:      #0d1117;
    --tile:    #161b22;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --pending: #30363d;
    --grey:    #6e7681;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 368px; height: 448px; overflow: hidden; }
  body {
    background: var(--bg);
    font: 500 13px/1.2 Geist, -apple-system, system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 140px;
    gap: 8px;
    padding: 6px;
  }

  .tile {
    position: relative;
    background: var(--tile);
    border: 2px solid var(--tint);
    border-radius: 14px;
    overflow: hidden;
    padding: 8px;
  }
  .tile.wide { grid-column: 1 / -1; }

  /* The countdown: a tinted wash rising from the bottom, with an animated
     surface line. Only the surface moves — the body is a static gradient. */
  .wash {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--fill);
    background: linear-gradient(to top, color-mix(in srgb, var(--tint) 42%, transparent), transparent);
    pointer-events: none;
  }
  /* A real curve, not a clipped bar: an SVG path stretched to the tile so the
     surface reads as liquid rather than a progress bar edge. */
  .surface {
    position: absolute; left: 0; right: 0;
    bottom: calc(var(--fill) - 4px);
    height: 8px; width: 100%;
    opacity: .85;
    pointer-events: none;
  }
  .surface path { fill: none; stroke: var(--tint); stroke-width: 1.6; }

  /* No captions: the icon is the whole identifier, so it gets the room the
     name used to take and a heavier stroke to hold up at 1x. */
  .icon { position: relative; width: 34px; height: 34px; stroke: var(--tint); fill: none;
          stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
          filter: drop-shadow(0 1px 3px var(--bg)); }
  .cd   { position: absolute; top: 8px; right: 10px; font-size: 22px; font-weight: 500;
          letter-spacing: -.02em; font-variant-numeric: tabular-nums;
          text-shadow: 0 1px 3px var(--bg), 0 0 6px var(--bg); }

  .dots { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; }
  .dot  { width: 7px; height: 7px; border-radius: 99px; }
  .done { background: var(--tint); }
  .skip { background: var(--grey); }
  .miss { border: 1px solid var(--grey); }      /* hollow ring */
  .pend { background: var(--pending); }
</style>

<div class="grid">
  <!-- Stand break -->
  <div class="tile" style="--tint:#7fd4a8; --fill:62px">
    <div class="wash"></div><svg class="surface" viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4Q7.5 0.6 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/></svg>
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v7m0 0-3 6m3-6 3 6M8 10h8"/></svg>
    <div class="cd">4m</div>
    <div class="dots">
      <i class="dot done"></i><i class="dot done"></i><i class="dot done"></i><i class="dot done"></i>
      <i class="dot miss"></i><i class="dot pend"></i><i class="dot pend"></i><i class="dot pend"></i>
      <i class="dot pend"></i><i class="dot pend"></i>
    </div>
  </div>

  <!-- Water -->
  <div class="tile" style="--tint:#6ec3e0; --fill:30px">
    <div class="wash"></div><svg class="surface" viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4Q7.5 0.6 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/></svg>
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 10.5A6 6 0 0 1 6 13.5C6 9.5 12 3 12 3Z"/></svg>
    <div class="cd">18m</div>
    <div class="dots">
      <i class="dot done"></i><i class="dot done"></i><i class="dot done"></i>
      <i class="dot skip"></i><i class="dot pend"></i><i class="dot pend"></i>
      <i class="dot pend"></i><i class="dot pend"></i>
    </div>
  </div>

  <!-- Shoulder roll -->
  <div class="tile" style="--tint:#b6a3e8; --fill:80px">
    <div class="wash"></div><svg class="surface" viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4Q7.5 0.6 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/></svg>
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
    <div class="cd">1m</div>
    <div class="dots">
      <i class="dot done"></i><i class="dot done"></i><i class="dot miss"></i><i class="dot miss"></i>
      <i class="dot pend"></i><i class="dot pend"></i><i class="dot pend"></i><i class="dot pend"></i>
    </div>
  </div>

  <!-- Snack -->
  <div class="tile" style="--tint:#e8b06a; --fill:0px">
    <div class="wash"></div>
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 8c-4-3-8 0-8 5s4 8 5.5 8 1.6-.8 2.5-.8 1 .8 2.5.8S20 18 20 13s-4-8-8-5Z"/><path d="M12 8c0-2 1-3.5 3-4"/></svg>
    <div class="cd">—</div>
    <div class="dots"><i class="dot done"></i><i class="dot pend"></i></div>
  </div>

  <!-- Lunch -->
  <div class="tile" style="--tint:#e8926a; --fill:44px">
    <div class="wash"></div><svg class="surface" viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4Q7.5 0.6 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/></svg>
    <svg class="icon" viewBox="0 0 24 24"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8 7.5c0-1.5 1-2 1-3M12 7.5c0-1.5 1-2 1-3M16 7.5c0-1.5 1-2 1-3"/></svg>
    <div class="cd">26m</div>
    <div class="dots"><i class="dot pend"></i></div>
  </div>

  <!-- Stretches -->
  <div class="tile" style="--tint:#e0d16a; --fill:14px">
    <div class="wash"></div><svg class="surface" viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4Q7.5 0.6 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/></svg>
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <div class="cd">55m</div>
    <div class="dots"><i class="dot done"></i><i class="dot pend"></i></div>
  </div>

</div>
